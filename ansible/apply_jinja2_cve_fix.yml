---
- name: Pin jinja2 to patched rhlw CVE-fix build and open a PR
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    lightwell_repo: git@github.com:shadowman-lab/Ansible-Lightwell.git
    lightwell_clone_dest: /tmp/ansible-lightwell-cvefix
    cve_fix_branch: security/cvefix
    jinja2_fixed_version: "3.1.5+rhlw.1"
    github_api_url: https://api.github.com/repos/shadowman-lab/Ansible-Lightwell

  tasks:
    - name: Clone Ansible-Lightwell
      ansible.builtin.git:
        repo: "{{ lightwell_repo }}"
        dest: "{{ lightwell_clone_dest }}"
        version: main
        accept_newhostkey: true
        key_file: "{{ cert_key_file }}"

    - name: Create the CVE fix branch
      ansible.builtin.command:
        cmd: git checkout -b {{ cve_fix_branch }}
        chdir: "{{ lightwell_clone_dest }}"

    - name: Pin jinja2 to the patched rhlw build in requirements.txt
      ansible.builtin.lineinfile:
        path: "{{ lightwell_clone_dest }}/requirements.txt"
        regexp: '^jinja2=='
        line: "jinja2=={{ jinja2_fixed_version }}"

    - name: Point CI at the Lightwell Nexus repository
      ansible.builtin.lineinfile:
        path: "{{ lightwell_clone_dest }}/.github/workflows/ci.yml"
        regexp: '^(\s*)NEXUS_PYPI_URL=.*$'
        line: '\1NEXUS_PYPI_URL=${{ secrets.NEXUS_PYPI_URL }}'
        backrefs: true

    - name: Commit and push the CVE fix branch
      ansible.builtin.shell: >
        git add -A &&
        git commit -m "Pin jinja2 to patched rhlw CVE-fix build" &&
        git config core.sshCommand 'ssh -i {{ cert_key_file }} -F /dev/null' &&
        git push origin {{ cve_fix_branch }}
      args:
        chdir: "{{ lightwell_clone_dest }}"
      environment:
        GIT_COMMITTER_NAME: "{{ git_name | default(omit) }}"
        GIT_COMMITTER_EMAIL: "{{ git_email | default(omit) }}"
        GIT_AUTHOR_NAME: "{{ git_name | default(omit) }}"
        GIT_AUTHOR_EMAIL: "{{ git_email | default(omit) }}"
      register: gitresult
      failed_when: gitresult.rc > 1
      changed_when: gitresult.rc == 0

    - name: Open a pull request for the CVE fix
      ansible.builtin.uri:
        url: "{{ github_api_url }}/pulls"
        method: POST
        headers:
          Authorization: Bearer {{ github_pat }}
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          title: "Pin jinja2 to patched rhlw CVE-fix build"
          head: "{{ cve_fix_branch }}"
          base: main
          body: |
            ## Summary
            - Pins `jinja2` in `requirements.txt` to the patched `{{ jinja2_fixed_version }}` build to remediate the known CVE in `jinja2==3.1.5`.
            - Points CI's Nexus PyPI build-arg at the Lightwell repository (`secrets.NEXUS_PYPI_URL`) so the build can resolve the patched version.
        status_code: 201
      register: pr_result

    - name: Show the pull request URL
      ansible.builtin.debug:
        msg: "Pull request created: {{ pr_result.json.html_url }}"

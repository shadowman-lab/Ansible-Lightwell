---
- name: Deploy cat-gif-generator container via podman to Dev and Test
  hosts: "{{ vm_name | default('all')}}"
  gather_facts: false

  vars:
    container_image: ghcr.io/shadowman-lab/cat-gif-generator
    image_tag: latest
    app_port: 5001
    environments:
      - name: dev
        published_port: 5001
      - name: test
        published_port: 5002

  tasks:
    - name: Login to ghcr
      containers.podman.podman_login:
        username: adworjan
        password: "{{ github_pat }}"
        registry: ghcr.io

    - name: Deploy and verify each environment with rollback on failure
      ansible.builtin.include_tasks: tasks/deploy_and_verify_with_rollback.yml
      loop: "{{ environments }}"
      loop_control:
        label: "{{ item.name }}"

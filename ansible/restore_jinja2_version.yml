---
- name: Restore jinja2 to pre-fix version and push to main
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    lightwell_repo: git@github.com:shadowman-lab/Ansible-Lightwell.git
    lightwell_clone_dest: /tmp/ansible-lightwell-restore
    jinja2_restore_version: "3.1.5,!=3.1.5+rhlw.1"
    cve_fix_branch: security/cvefix
    github_org: shadowman-lab
    container_package_name: cat-gif-generator
    dtrack_url: https://lightwelldemo.shadowman.dev:4000

  tasks:
    - name: Delete all existing cat-gif-generator container package versions
      ansible.builtin.uri:
        url: "https://api.github.com/orgs/{{ github_org }}/packages/container/{{ container_package_name }}"
        method: DELETE
        headers:
          Authorization: Bearer {{ github_pat }}
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        status_code: [204, 404]
      register: package_delete_result

    - name: Clone Ansible-Lightwell
      ansible.builtin.git:
        repo: "{{ lightwell_repo }}"
        dest: "{{ lightwell_clone_dest }}"
        version: main
        accept_newhostkey: true
        key_file: "{{ cert_key_file }}"

    - name: Restore jinja2 version in requirements.txt
      ansible.builtin.lineinfile:
        path: "{{ lightwell_clone_dest }}/requirements.txt"
        regexp: '^jinja2=='
        line: "jinja2=={{ jinja2_restore_version }}"

    - name: Commit and push directly to main
      ansible.builtin.shell: >
        git add -A &&
        git commit -m "Restore jinja2 to pre-fix version" &&
        git config core.sshCommand 'ssh -i {{ cert_key_file }} -F /dev/null' &&
        git push origin main
      args:
        chdir: "{{ lightwell_clone_dest }}"
      environment:
        GIT_COMMITTER_NAME: "{{ git_name | default(omit) }}"
        GIT_COMMITTER_EMAIL: "{{ git_email | default(omit) }}"
        GIT_AUTHOR_NAME: "{{ git_name | default(omit) }}"
        GIT_AUTHOR_EMAIL: "{{ git_email | default(omit) }}"
      register: gitresult
      failed_when: gitresult.rc > 1
      changed_when: gitresult.rc == 0

    - name: Delete the CVE fix branch
      ansible.builtin.command:
        cmd: git push origin --delete {{ cve_fix_branch }}
        chdir: "{{ lightwell_clone_dest }}"
      register: branch_delete_result
      failed_when: branch_delete_result.rc > 1
      changed_when: branch_delete_result.rc == 0

    - name: Get all SBOM projects from Dependency-Track
      ansible.builtin.uri:
        url: "{{ dtrack_url }}/api/v1/project?pageSize=1000"
        method: GET
        headers:
          X-Api-Key: "{{ dtrack_api_key }}"
          Accept: application/json
        status_code: 200
        return_content: true
      register: dtrack_projects

    - name: Delete all SBOM projects from Dependency-Track
      ansible.builtin.uri:
        url: "{{ dtrack_url }}/api/v1/project/{{ item.uuid }}"
        method: DELETE
        headers:
          X-Api-Key: "{{ dtrack_api_key }}"
        status_code: [204, 404]
      loop: "{{ dtrack_projects.json }}"
      loop_control:
        label: "{{ item.name }} {{ item.version | default('') }}"

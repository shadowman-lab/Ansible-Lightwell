---
- name: Record current image for {{ item.name }} before deploying
  containers.podman.podman_container_info:
    name: "cat-gif-generator-{{ item.name }}"
  register: previous_container_info
  failed_when: false

- name: Deploy and verify new image for {{ item.name }}
  block:
    - name: Run cat-gif-generator container for {{ item.name }}
      containers.podman.podman_container:
        name: "cat-gif-generator-{{ item.name }}"
        image: "{{ container_image }}:{{ image_tag }}"
        state: started
        restart_policy: always
        ports:
          - "{{ item.published_port }}:{{ app_port }}"

    - name: Verify {{ item.name }} is running and responding
      ansible.builtin.uri:
        url: "http://localhost:{{ item.published_port }}/"
        status_code: 200
      register: app_health_check
      retries: 5
      delay: 5
      until: app_health_check.status == 200
      changed_when: false

  rescue:
    - name: Roll back {{ item.name }} to the previous image
      containers.podman.podman_container:
        name: "cat-gif-generator-{{ item.name }}"
        image: "{{ previous_container_info.containers[0].ImageName }}"
        state: started
        restart_policy: always
        ports:
          - "{{ item.published_port }}:{{ app_port }}"
      when: previous_container_info.containers | default([]) | length > 0

    - name: Fail the play after the rollback attempt
      ansible.builtin.fail:
        msg: >-
          Deploying {{ container_image }}:{{ image_tag }} to {{ item.name }} failed.
          {{ 'Rolled back to the previous image.'
             if (previous_container_info.containers | default([]) | length > 0)
             else 'No previous image was running; nothing to roll back to.' }}

---
- name: Create service group for {{ prod_instance.name }}
  netscaler.adc.servicegroup:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    servicegroupname: "cat-gif-generator-{{ prod_instance.name }}-svcgrp"
    servicetype: HTTP
    state: present
    validate_certs: false
    servicegroup_servicegroupmember_binding:
      mode: bind
      binding_members:
        - servername: "{{ inventory_hostname }}"
          port: "{{ prod_instance.published_port }}"
          servicegroupname: "cat-gif-generator-{{ prod_instance.name }}-svcgrp"
    servicegroup_lbmonitor_binding:
      mode: desired
      binding_members:
        - monitor_name: http
          servicegroupname: "cat-gif-generator-{{ prod_instance.name }}-svcgrp"
  delegate_to: localhost

- name: Bind service group to the shared virtual server
  netscaler.adc.lbvserver_servicegroup_binding:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    name: "{{ lb_vserver_name }}"
    servicegroupname: "cat-gif-generator-{{ prod_instance.name }}-svcgrp"
    state: present
    validate_certs: false
  delegate_to: localhost
